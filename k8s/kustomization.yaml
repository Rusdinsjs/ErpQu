apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erpqu

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: erpqu-config
    literals:
      - APP_ENV=production
      - LOG_FORMAT=json
      - BIND_ADDRESS=0.0.0.0:8080
      - CORS_ALLOWED_ORIGINS=https://erpqu.com,https://*.erpqu.com

secretGenerator:
  - name: erpqu-secrets
    literals:
      - DATABASE_URL=postgres://erpqu_app:CHANGE_ME_IN_PROD@postgres-svc:5432/management_system
      - REDIS_URL=redis://:CHANGE_ME_IN_PROD@redis-svc:6379/0
      - JWT_SECRET=CHANGE_ME_SUPER_SECRET_KEY_MIN_32_CHARS
