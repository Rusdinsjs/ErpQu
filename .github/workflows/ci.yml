name: Trusted Quality Gate CI Pipeline (Fase 2)

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-quality-gate:
    name: 1. Backend Strict Quality Gate & Real DB Invariant Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: erp_system_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: 1.1 Cargo Format Verification
        run: cargo fmt --all -- --check

      - name: 1.2 Cargo Compilation Check (All Targets)
        run: cargo check --workspace --all-targets

      - name: 1.3 Cargo Clippy Strict Linting
        run: cargo clippy --workspace --all-targets

      - name: 1.4 Backend Invariant & Real Database Integration Tests
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
          MIGRATION_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-key-for-testing-only-minimum-16-chars
          ENVIRONMENT: test
        run: cargo test --workspace --tests

  frontend-quality-gate:
    name: 2. Frontend Strict TypeScript, ESLint, Unit Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./web-admin/package-lock.json

      - name: 2.1 Clean Dependency Installation
        run: npm ci

      - name: 2.2 Strict TypeScript Type Check
        run: npx tsc --noEmit

      - name: 2.3 ESLint Clean Code Check
        run: npm run lint

      - name: 2.4 Frontend Unit Tests (Vitest)
        run: npx vitest run

      - name: 2.5 Production Bundle Compilation
        run: npm run build

  mobile-quality-gate:
    name: 3. Mobile TypeScript & Expo Configuration Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./mobile/package-lock.json

      - name: 3.1 Clean Dependency Installation
        run: npm ci

      - name: 3.2 Mobile TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: 3.3 Expo Configuration Validation
        run: npx expo config --type public

  security-audit-gate:
    name: 4. Security Scan & Blocking Secret/Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 4.1 Blocking Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4.2 Blocking Cargo Security Audit
        uses: rustsec/audit-check-action@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
