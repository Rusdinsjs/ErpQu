name: ERPQu Quality Gate CI Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  # ═══════════════════════════════════════════════════
  # 1. BACKEND QUALITY GATE
  # ═══════════════════════════════════════════════════
  backend-quality-gate:
    name: "🦀 Backend: Lint, Test & Coverage"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erp_system_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: "1.1 ✅ Cargo Format Verification"
        run: cargo fmt --all -- --check

      - name: "1.2 ✅ Cargo Compilation Check"
        run: cargo check --workspace --all-targets

      - name: "1.3 ✅ Cargo Clippy Strict Linting"
        run: cargo clippy --workspace --all-targets -- -W clippy::all

      - name: "1.4 ✅ Database Schema Preparation"
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
        run: |
          # Create schemas required by multi-schema architecture
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d erp_system_test -c "
            CREATE SCHEMA IF NOT EXISTS hr;
            CREATE SCHEMA IF NOT EXISTS crm;
            CREATE SCHEMA IF NOT EXISTS rental;
            CREATE SCHEMA IF NOT EXISTS inventory;
            CREATE SCHEMA IF NOT EXISTS commercial;
            CREATE ROLE erpqu_app NOLOGIN;
          "

      - name: "1.4.1 ⚡ Install SQLx CLI"
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: "1.5 ✅ Database Migration Dry-Run"
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
          MIGRATION_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
        run: |
          sqlx migrate run --source migrations/ 2>&1 | tail -20
          echo "✅ All migrations applied successfully"

      - name: "1.6 ✅ Backend Integration Tests"
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
          MIGRATION_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-key-for-testing-only-minimum-32-chars!!
          ENVIRONMENT: test
          RUST_LOG: warn
        run: cargo test --workspace --tests 2>&1

      - name: "1.6.1 ⚡ Install Cargo Tarpaulin"
        if: github.event_name == 'pull_request'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: "1.7 📊 Test Coverage Report"
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
          MIGRATION_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/erp_system_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super-secret-key-for-testing-only-minimum-32-chars!!
          ENVIRONMENT: test
        run: |
          cargo tarpaulin --workspace --out xml --output-dir coverage/ --timeout 300 || true
          echo "Coverage report generated in coverage/"

  # ═══════════════════════════════════════════════════
  # 2. FRONTEND QUALITY GATE
  # ═══════════════════════════════════════════════════
  frontend-quality-gate:
    name: "⚛️ Frontend: TypeScript, Lint, Test & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./web-admin/package-lock.json

      - name: "2.1 ✅ Clean Dependency Installation"
        run: npm ci

      - name: "2.2 ✅ Strict TypeScript Type Check"
        run: npx tsc --noEmit

      - name: "2.3 ✅ ESLint Clean Code Check"
        run: npm run lint

      - name: "2.4 ✅ Frontend Unit Tests (Vitest)"
        run: npx vitest run --reporter=verbose

      - name: "2.5 ✅ Production Bundle Compilation"
        run: npm run build

      - name: "2.6 📊 Bundle Size Analysis"
        run: |
          echo "=== Bundle Size Report ==="
          du -sh dist/
          find dist/assets -name "*.js" -exec du -sh {} \; | sort -rh | head -10
          echo "========================="

  # ═══════════════════════════════════════════════════
  # 3. MOBILE QUALITY GATE
  # ═══════════════════════════════════════════════════
  mobile-quality-gate:
    name: "📱 Mobile: TypeScript & Expo Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./mobile/package-lock.json

      - name: "3.1 ✅ Clean Dependency Installation"
        run: npm ci

      - name: "3.2 ✅ Mobile TypeScript Strict Type Check"
        run: npx tsc --noEmit

      - name: "3.3 ✅ Expo Configuration Validation"
        run: npx expo config --type public

  # ═══════════════════════════════════════════════════
  # 4. SECURITY AUDIT GATE
  # ═══════════════════════════════════════════════════
  security-audit-gate:
    name: "🔒 Security: Secrets & Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "4.1 ✅ Blocking Secret Scanning (Gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "4.2 ✅ Non-Blocking Cargo Security Audit"
        uses: rustsec/audit-check@v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: Docker image build & push is handled by deploy.yml workflow.
  # No duplicate build-images job needed here.
