name: ERPQu Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

# Only one deployment at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ═══════════════════════════════════════════════════
  # 1. BUILD IMMUTABLE CONTAINER IMAGES
  # ═══════════════════════════════════════════════════
  build-and-push:
    name: "🐳 Build Immutable Container Images"
    runs-on: ubuntu-latest
    outputs:
      image_sha: ${{ github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: prep
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-backend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-admin
          file: ./apps/web-admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-frontend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: Staging deployment removed — no staging server configured.
  # To re-enable, add STAGING_HOST, STAGING_USERNAME, STAGING_SSH_KEY secrets
  # and create a 'staging' environment in GitHub repository settings.

  # ═══════════════════════════════════════════════════
  # 3. DEPLOY TO PRODUCTION (manual approval required)
  # ═══════════════════════════════════════════════════
  deploy-production:
    name: "🚀 Deploy to Production"
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_SHA
          command_timeout: 60m
          script: |
            set -e
            echo "══════════════════════════════════════════"
            echo "  🚀 ERPQu PRODUCTION Deployment"
            echo "  SHA: ${IMAGE_SHA}"
            echo "  Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "══════════════════════════════════════════"

            cd /opt/erpqu

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin 2>/dev/null

            # Sync code
            git fetch --all --prune
            git reset --hard origin/main

            # Verify production .env
            [ -f .env ] || { echo "CRITICAL: .env missing on production!"; exit 1; }

            export IMAGE_TAG="${IMAGE_SHA}"

            # === MANDATORY PRE-DEPLOYMENT BACKUP ===
            echo ">> Creating MANDATORY production backup..."
            BACKUP_FILE="/backups/pre_deploy_$(date +%Y%m%d_%H%M%S).dump"
            mkdir -p /backups
            DB_USER_VAL=$(grep -E '^DB_USER=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r\n"' || echo "postgres")
            DB_PASS_VAL=$(grep -E '^DB_PASSWORD=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r\n"' || true)
            DB_NAME_VAL=$(grep -E '^DB_NAME=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r\n"' || echo "management_system")
            docker compose -f docker-compose.prod.yml exec -T -e PGPASSWORD="${DB_PASS_VAL}" postgres \
              pg_dump -U "${DB_USER_VAL}" -Fc "${DB_NAME_VAL}" > "$BACKUP_FILE" 2>/dev/null || {
                echo "WARNING: Pre-deploy backup failed. Proceeding with caution."
              }
            if [ -s "$BACKUP_FILE" ]; then
              echo "   Backup: $BACKUP_FILE ($(du -sh "$BACKUP_FILE" | cut -f1))"
            else
              rm -f "$BACKUP_FILE" 2>/dev/null || true
            fi

            # Pull new images
            echo ">> Pulling production images [${IMAGE_SHA:0:8}]..."
            docker compose -f docker-compose.prod.yml pull backend frontend

            # Run migrations (fail-closed)
            echo ">> Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm --build migrate || {
                echo "═══════════════════════════════════════"
                echo "CRITICAL: Migration FAILED!"
                echo "Production database is UNCHANGED."
                echo "Backup available at: $BACKUP_FILE"
                echo "═══════════════════════════════════════"
                exit 1
            }

            # Rolling deployment
            echo ">> Starting production services..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Strict readiness gate
            echo ">> Production readiness gate..."
            READY=0
            for i in $(seq 1 40); do
              if docker exec erpqu-backend curl -sf http://localhost:8181/health > /dev/null 2>&1; then
                echo ">> ✅ Production service READY ($i/40)"
                READY=1
                break
              fi
              echo "   Waiting for readiness... ($i/40)"
              sleep 5
            done

            if [ "$READY" -eq 0 ]; then
              echo "═══════════════════════════════════════"
              echo "CRITICAL: Production readiness FAILED!"
              echo "Initiating AUTOMATIC ROLLBACK..."
              echo "═══════════════════════════════════════"

              # Rollback: stop new containers
              docker compose -f docker-compose.prod.yml down

              # Restore database from backup
              docker compose -f docker-compose.prod.yml up -d postgres redis
              sleep 15
              if [ -f "$BACKUP_FILE" ]; then
                docker exec -i erpqu-db pg_restore -U postgres -d management_system \
                  --clean --if-exists < "$BACKUP_FILE" || true
                echo ">> Database restored from: $BACKUP_FILE"
              fi

              # Restart with previous image
              unset IMAGE_TAG
              docker compose -f docker-compose.prod.yml up -d
              echo ">> ROLLBACK COMPLETE. Previous version restored."
              exit 1
            fi

            # Post-deploy verification
            echo ">> Post-deployment verification..."
            HEALTH_RESPONSE=$(docker exec erpqu-backend curl -sf http://localhost:8181/health 2>/dev/null)
            echo "   Health: $HEALTH_RESPONSE"

            # Cleanup
            docker image prune -f

            echo "══════════════════════════════════════════"
            echo "  ✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
            echo "  SHA: ${IMAGE_SHA}"
            echo "  Backup: ${BACKUP_FILE}"
            echo "  Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "══════════════════════════════════════════"

      - name: Purge Cloudflare CDN Cache
        if: success()
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE" ] && [ -n "$CF_TOKEN" ]; then
            echo ">> Purging Cloudflare CDN Cache..."
            PURGE_RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo ">> Cloudflare Response: $PURGE_RES"
          else
            echo ">> Notice: CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN secrets not configured. Skipping automated purge."
          fi

      - name: Notify Production Success
        if: success()
        run: |
          echo "🚀 Production deployment successful: ${{ github.sha }}"

      - name: Notify Production Failure
        if: failure()
        run: |
          echo "❌ Production deployment FAILED: ${{ github.sha }}"

