name: Trusted Continuous Deployment (Gate 1)

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Immutable Container Images (Image SHA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: prep
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image (Immutable SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-backend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image (Immutable SHA)
        uses: docker/build-push-action@v5
        with:
          context: ./web-admin
          file: ./web-admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-frontend:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/erp-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via Dedicated Migration Runner & Readiness Gate
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_SHA
          command_timeout: 60m
          script: |
            set -e
            cd ~/erp-system

            echo "$GITHUB_TOKEN" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin 2>/dev/null || true

            git fetch --all
            git reset --hard origin/master || git reset --hard origin/main
            echo ">> Repository synced to ${IMAGE_SHA}."

            if [ ! -f .env ]; then
              echo "CRITICAL: .env file missing on production host!"
              exit 1
            fi

            # 1. Pull immutable image tag by SHA
            echo ">> Pulling image SHA ${IMAGE_SHA}..."
            sudo docker compose pull backend frontend

            # 2. Run dedicated database migration runner (Fail-Closed)
            echo ">> Executing dedicated migration runner..."
            sudo docker compose run --rm -e RUN_MIGRATIONS_ON_STARTUP=true backend /usr/local/bin/management-system --check-migration || {
                echo "CRITICAL: Database migration failed. Aborting deployment (Fail-Closed)!"
                exit 1
            }
            echo ">> Migrations applied successfully."

            # 3. Start services with rolling replacement
            echo ">> Starting application services..."
            sudo docker compose up -d --remove-orphans

            # 4. Strict Readiness Gate Verification (Port 8181 / 8080)
            echo ">> Probing readiness endpoint on port 8181/8080..."
            READINESS_PASSED=0
            for i in $(seq 1 30); do
              if sudo docker exec mgmt-backend curl -sf http://localhost:8181/ready >/dev/null 2>&1 || \
                 sudo docker exec mgmt-backend curl -sf http://localhost:8080/ready >/dev/null 2>&1 || \
                 sudo docker exec mgmt-backend curl -sf http://localhost:8080/health >/dev/null 2>&1; then
                echo ">> Service READINESS GATE PASSED ($i/30)!"
                READINESS_PASSED=1
                break
              fi
              echo "   Awaiting service readiness... ($i/30)"
              sleep 5
            done

            if [ "$READINESS_PASSED" -eq 0 ]; then
              echo "CRITICAL: Service readiness probe failed after 150s. Initiating automatic rollback!"
              sudo docker compose rollback || sudo docker compose up -d --build
              sudo docker logs mgmt-backend --tail 100
              exit 1
            fi

            sudo systemctl reload nginx || true
            sudo docker image prune -f
            echo ">> DEPLOYMENT SUCCESSFUL & SEALED [SHA: ${IMAGE_SHA}]"
