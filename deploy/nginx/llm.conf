        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, Cache-Control, X-Requested-With, x-api-key, anthropic-version, dangerously-allow-browser' always;

        proxy_pass http://freellmapi-freellmapi-1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
