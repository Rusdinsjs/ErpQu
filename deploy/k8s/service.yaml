apiVersion: v1
kind: Service
metadata:
  name: erpqu-backend-svc
  namespace: erpqu
  labels:
    app.kubernetes.io/name: erpqu-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: erpqu-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erpqu-ingress
  namespace: erpqu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit-rps: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.erpqu.com"
        - "erpqu.com"
      secretName: erpqu-tls
  rules:
    - host: "erpqu.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erpqu-backend-svc
                port:
                  number: 8080
    - host: "*.erpqu.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erpqu-backend-svc
                port:
                  number: 8080
